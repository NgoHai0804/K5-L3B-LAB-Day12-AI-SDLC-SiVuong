<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quán Ăn Chợ Nổi</title>
<style>
  html, body { margin: 0; height: 100%; background: #06203a; color: #fff6e6; font: 18px/1.4 "Segoe UI", system-ui, sans-serif; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
"use strict";
/*
 * Quán Ăn Chợ Nổi — client trình duyệt. CHỈ ĐỌC snapshot (GET /state) và gửi phím (POST /input, /next, /new, /buy, /menu, /quit).
 * Vẽ thẳng ở độ phân giải gốc của màn hình (nhân devicePixelRatio) để nét mịn và chi tiết.
 * Hiệu ứng (sóng, bọt, tia sáng, khói, chữ bay, âm thanh) dùng Math.random của trình duyệt, KHÔNG vào mô phỏng.
 * Phím: WASD/mũi tên · Shift sprint · E tương tác · Space bắt cá · Esc/P tạm dừng · Enter tiếp · 1–7 mua · R chơi lại Ngày · M tiếng.
 */
const cv = document.getElementById("c");
const MAIN = cv.getContext("2d");
let ctx = MAIN, DPR = 1;
// Lớp nền vẽ sẵn vào canvas phụ, chỉ vẽ lại khi đổi khóa (kích thước / giờ trong ngày) -> bớt tốn fill-rate.
const LAYERS = {};
function layer(name, key, w, h, draw) {
  let L = LAYERS[name];
  if (!L) L = LAYERS[name] = { c: document.createElement("canvas"), key: null };
  if (L.key !== key) {
    L.key = key;
    L.c.width = Math.max(1, Math.round(w * DPR)); L.c.height = Math.max(1, Math.round(h * DPR));
    const g = L.c.getContext("2d"); g.setTransform(DPR, 0, 0, DPR, 0, 0);
    const old = ctx; ctx = g;
    try { draw(); } finally { ctx = old; }
  }
  return L.c;
}
let snap = null, offline = false, quitted = false;
let hiC = false;  // chế độ tương phản cao (phím H bật/tắt)
const CAPS = [];  // phụ đề SFX: hiện cả khi tắt tiếng
function say(txt) { CAPS.push({ text: txt, t0: performance.now() }); if (CAPS.length > 4) CAPS.shift(); }
const W2S = { sx: (x) => x, sy: (y) => y, s: 1 };

// ============================================================ TIỆN ÍCH
const FONT = '"Segoe UI", system-ui, sans-serif';
const now = () => performance.now() / 1000;
const clamp01 = (v) => Math.max(0, Math.min(1, v));
const lerp = (a, b, t) => a + (b - a) * t;
function hash(n) { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }
function text(s, x, y, o = {}) {
  ctx.font = (o.weight || "600") + " " + (o.size || 18) + "px " + FONT;
  ctx.textAlign = o.align || "left"; ctx.textBaseline = o.base || "alphabetic";
  const stroke = o.stroke || (hiC ? "rgba(0,0,0,.95)" : null);
  if (stroke) { ctx.lineWidth = (o.strokeW || 4) + (hiC && !o.stroke ? 2 : 0); ctx.strokeStyle = stroke; ctx.lineJoin = "round"; ctx.strokeText(s, x, y); }
  ctx.fillStyle = o.color || (hiC ? "#ffffff" : "#fff6e6"); ctx.fillText(s, x, y);
}
function textW(s, size = 18, weight = "600") { ctx.font = weight + " " + size + "px " + FONT; return ctx.measureText(s).width; }
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x, y, w, h, r) : ctx.rect(x, y, w, h); }
try { hiC = localStorage.getItem("chonoi_hc") === "1"; } catch (e) {}
if (new URLSearchParams(location.search).get("hc") === "1") hiC = true;
function toggleHC() { hiC = !hiC; say(hiC ? "Tương phản cao: BẬT" : "Tương phản cao: TẮT"); try { localStorage.setItem("chonoi_hc", hiC ? "1" : "0"); } catch (e) {} }
function panel(x, y, w, h, o = {}) {
  if (hiC && o.light) o = Object.assign({}, o, { stroke: "#000", lw: 4, shadow: false });  // thẻ sáng: giữ nền sáng, viền đen đậm
  else if (hiC && !o.keep) o = Object.assign({}, o, { fill: "#000", stroke: "#ffeb3b", lw: 3, shadow: false });
  ctx.save();
  if (o.shadow !== false) { rr(x + 2, y + 4, w, h, o.r ?? 12); ctx.fillStyle = "rgba(0,0,0,.22)"; ctx.fill(); }
  rr(x, y, w, h, o.r ?? 12);
  ctx.fillStyle = o.fill || (hiC ? "rgba(0,0,0,.96)" : "rgba(10,34,58,.82)"); ctx.fill(); ctx.restore();
  rr(x, y, w, h, o.r ?? 12);
  ctx.lineWidth = (o.lw || 2) + (hiC ? 2 : 0); ctx.strokeStyle = o.stroke || (hiC ? "#ffffff" : "rgba(160,230,255,.45)"); ctx.stroke();
}
function bar(x, y, w, h, frac, col, bg = "rgba(0,0,0,.35)") {
  rr(x, y, w, h, h / 2); ctx.fillStyle = bg; ctx.fill();
  if (frac > 0) { rr(x, y, Math.max(h, w * clamp01(frac)), h, h / 2); ctx.fillStyle = col; ctx.fill(); }
  ctx.fillStyle = "rgba(255,255,255,.22)"; rr(x + 2, y + 1, Math.max(0, w * clamp01(frac) - 4), h * .35, h * .2); ctx.fill();
}
function fmtTime(ticks) { const s = Math.ceil((ticks || 0) / 60); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); }
function lg(y0, y1, stops) { const g = ctx.createLinearGradient(0, y0, 0, y1); stops.forEach(([o, c]) => g.addColorStop(o, c)); return g; }
function ellipse(x, y, rx, ry, rot = 0) { ctx.beginPath(); ctx.ellipse(x, y, Math.max(.1, rx), Math.max(.1, ry), rot, 0, Math.PI * 2); }
function circle(x, y, r) { ctx.beginPath(); ctx.arc(x, y, Math.max(.1, r), 0, Math.PI * 2); }
function freshCol(f) { return f >= 70 ? "#5ee07a" : f >= 45 ? "#d7e35a" : f >= 30 ? "#ffb347" : "#9a8a78"; }

// ============================================================ DỮ LIỆU
const KIND = {
  ca_loc: { name: "Cá lóc" }, ca_linh: { name: "Cá linh" }, ca_keo: { name: "Cá kèo" },
  bong_dien_dien: { name: "Bông điên điển" }, bong_sung: { name: "Bông súng" }, keo_neo: { name: "Kèo nèo" },
};
const DISH_NAME = {
  ca_loc_nuong_trui: "Cá lóc nướng trui", goi_bong_sung: "Gỏi bông súng", lau_ca_linh_dien_dien: "Lẩu cá linh bông điên điển",
  canh_chua_ca_loc: "Canh chua cá lóc", ca_keo_nuong: "Cá kèo nướng muối ớt", lau_mam: "Lẩu mắm miền Tây",
};
Object.assign(DISH_NAME, {
  ca_linh_chien: "Cá linh chiên giòn", bong_sung_xao: "Bông súng xào tỏi", dien_dien_xao_trung: "Điên điển xào trứng",
  keo_neo_luoc: "Kèo nèo luộc chấm mắm", chao_ca_loc: "Cháo cá lóc", ca_keo_kho: "Cá kèo kho tộ",
});
const EXTRA_IDS = ["ca_linh_chien", "bong_sung_xao", "dien_dien_xao_trung", "keo_neo_luoc", "chao_ca_loc", "ca_keo_kho"];
const DISH_SHORT = {
  ca_loc_nuong_trui: "Cá lóc nướng", goi_bong_sung: "Gỏi bông súng", lau_ca_linh_dien_dien: "Lẩu cá linh",
  canh_chua_ca_loc: "Canh chua", ca_keo_nuong: "Cá kèo nướng", lau_mam: "Lẩu mắm",
  ca_linh_chien: "Cá linh chiên", bong_sung_xao: "Súng xào tỏi", dien_dien_xao_trung: "Điên điển xào",
  keo_neo_luoc: "Kèo nèo luộc", chao_ca_loc: "Cháo cá lóc", ca_keo_kho: "Cá kèo kho",
};
const menu = () => (snap && snap.menu) || {};
const STORY = [
  { title: "Ngày đầu mùa nước nổi", dawn: "Út ơi, má đau lưng quá. Con ra sông kiếm cá lóc với bông súng nấu cho khách nghen!", night: "Khách tới rồi Út! Nấu lẹ lẹ cho người ta ăn." },
  { title: "Cá linh về", dawn: "Nước lên, cá linh theo dòng về đông lắm. Hái thêm bông điên điển nấu lẩu nghen con.", night: "Lẩu cá linh bông điên điển là món tủ của quán mình đó." },
  { title: "Dưới đáy có cá kèo", dawn: "Mấy ổng nói cá kèo nằm sát đáy, mà coi chừng Cá Sấu Năm Chèo nghen con!", night: "Cá kèo nướng muối ớt thơm lừng, khách ghé đông." },
  { title: "Khách phương xa", dawn: "Có đoàn khách đòi ăn lẩu mắm. Kèo nèo mọc ở cuối khúc sông đó Út.", night: "Khách phương xa khó tánh, con nhớ bưng cho kịp." },
  { title: "Ngày cuối mùa", dawn: "Bữa cuối mùa nước nổi rồi. Ráng lên con, má tin con!", night: "Bữa cuối mùa, mình làm một bữa thiệt hoành tráng nghen!" },
];
const camp = () => (snap && snap.campaign) || null;
const stage = () => (camp() ? camp().stage : snap ? snap.phase : "gather");
const phase = () => (snap ? snap.phase : "gather");
const story = () => STORY[Math.max(0, Math.min(STORY.length - 1, ((snap && snap.day) || 1) - 1))];
const playing = () => snap && !snap.finished && !snap.paused && ["gather", "quan", "shop"].includes(stage());

// ============================================================ INPUT
const down = new Set();
const MOVE_KEYS = { w: "u", arrowup: "u", s: "d", arrowdown: "d", a: "l", arrowleft: "l", d: "r", arrowright: "r" };
let queue = [], inflight = false, lastSent = "", menuSel = 0, pauseSel = 0;
function currentInput() {
  const dx = (down.has("r") ? 1 : 0) - (down.has("l") ? 1 : 0);
  let dy = (down.has("d") ? 1 : 0) - (down.has("u") ? 1 : 0);
  if (phase() === "quan") dy = -dy;
  return { move: [dx, dy], interact: down.has("interact"), catch: down.has("catch"), sprint: down.has("sprint") };
}
function pushInput(extra) {
  const body = Object.assign(currentInput(), extra || {});
  const s = JSON.stringify(body);
  if (!extra && s === lastSent) return;
  lastSent = JSON.stringify(currentInput()); queue.push(s); flush();
}
async function flush() {
  if (inflight) return;
  inflight = true;
  while (queue.length) {
    const body = queue.shift();
    try { await fetch("/input", { method: "POST", body, headers: { "Content-Type": "application/json" } }); } catch (e) {}
  }
  inflight = false;
}
function post(path, body) { return fetch(path, { method: "POST", body: body ? JSON.stringify(body) : "", headers: { "Content-Type": "application/json" } }).then((r) => r.json()).catch(() => null); }
function advance() { post("/next"); fx.length = 0; }
function togglePause() { pushInput({ pause: true }); }
let muted = false;
function titleOptions() {
  const c = camp(); const o = [];
  if (c && c.can_continue) o.push(["cont", "Chơi tiếp (Ngày " + c.saved_day + ")"], ["new", "Chơi mới"]);
  else o.push(["play", "Chơi"]);
  o.push(["quit", "Thoát"]);
  return o;
}
function chooseTitle() {
  const [id] = titleOptions()[Math.min(menuSel, titleOptions().length - 1)];
  SFX.pick();
  if (id === "quit") { post("/quit"); quitted = true; }
  else if (id === "new") post("/new");
  else advance();
}
addEventListener("keydown", (e) => {
  const k = e.key.toLowerCase();
  audioInit();
  if ([" ", "arrowup", "arrowdown", "arrowleft", "arrowright", "tab"].includes(k)) e.preventDefault();
  if (k === "shift") { down.add("sprint"); pushInput(); return; }
  if (e.repeat) return;
  if (k === "m") { muted = !muted; say(muted ? "Tiếng: TẮT (phụ đề vẫn hiện)" : "Tiếng: BẬT"); return; }
  if (k === "h") { toggleHC(); return; }
  const st = stage(), c = camp();
  if (!snap || quitted) return;
  if (snap.paused && ["gather", "quan", "shop"].includes(st)) {
    if (k === "arrowup" || k === "w") pauseSel = (pauseSel + 2) % 3;
    else if (k === "arrowdown" || k === "s") pauseSel = (pauseSel + 1) % 3;
    else if (k === "escape" || k === "p") togglePause();
    else if (k === "enter" || k === "e" || k === " ") {
      SFX.pick();
      if (pauseSel === 0) { togglePause(); pauseSel = 0; } else if (pauseSel === 1) toggleHC(); else { post("/menu"); pauseSel = 0; }
    }
    return;
  }
  if (MG && st === "quan") { e.preventDefault(); mgKey(k); return; }
  if (st === "story") { SFX.pick(); storyAdvance(); return; }
  if (st === "title") {
    const n = titleOptions().length;
    if (k === "arrowup" || k === "w") menuSel = (menuSel + n - 1) % n;
    else if (k === "arrowdown" || k === "s") menuSel = (menuSel + 1) % n;
    else if (k === "enter" || k === "e" || k === " ") chooseTitle();
    else if (k === "n" && c && c.can_continue) { SFX.pick(); post("/new"); }
    return;
  }
  if (["dayintro", "eveningintro", "dayresult", "ending"].includes(st)) {
    if (k === "r" && st !== "ending" && st !== "dayresult") post("/restart");
    else { SFX.pick(); advance(); }
    return;
  }
  if (k === "escape" || k === "p") { SFX.pick(); pauseSel = 0; togglePause(); return; }
  if (st === "shop") {
    if (/^[1-9]$/.test(k)) {
      const item = c.shop[Number(k) - 1];
      if (item) post("/buy", { id: item.id }).then((r) => { if (!r || !r.ok) SFX.bad(); else if (!item.core) SFX.coin(); });
    } else if (k === "enter" || k === "e") { SFX.pick(); advance(); }
    return;
  }
  if (MOVE_KEYS[k]) down.add(MOVE_KEYS[k]);
  else if (k === "e") down.add("interact");
  else if (k === " ") down.add("catch");
  else if (k === "r") { post("/restart"); lastSent = ""; down.clear(); fx.length = 0; }
  else if (k === "q" && phase() === "gather") { pushInput({ drop: true }); return; }
  else if (k === "c" && phase() === "quan") { pushInput({ close_shift: true }); return; }
  pushInput();
});
// chuột: bấm ô giỏ để thả món; minigame băm (bấm) / chặt (kéo xuống)
const SLOTS = [];
let mouseDownY = null;
cv.addEventListener("mousedown", (e) => {
  audioInit();
  if (MG) { mouseDownY = e.clientY; if (MG.type === "mince") mgHit(); return; }
  if (phase() === "gather" && playing()) {
    const sl = SLOTS.find((r) => e.clientX >= r.x && e.clientX <= r.x + r.w && e.clientY >= r.y && e.clientY <= r.y + r.h);
    if (sl) pushInput({ drop: sl.id });
  }
});
addEventListener("mousemove", (e) => {
  if (!MG || MG.type !== "chop" || mouseDownY === null || !(e.buttons & 1)) return;
  if (e.clientY - mouseDownY > 60) { mgHit(); mouseDownY = e.clientY; }
});
addEventListener("mouseup", () => { mouseDownY = null; });
addEventListener("keyup", (e) => {
  const k = e.key.toLowerCase();
  if (MOVE_KEYS[k]) down.delete(MOVE_KEYS[k]);
  else if (k === "e") down.delete("interact");
  else if (k === " ") down.delete("catch");
  else if (k === "shift") down.delete("sprint");
  pushInput();
});
addEventListener("blur", () => { down.clear(); pushInput(); });

// ============================================================ POLL
let stageKey = "", seenTick = -1;
let snapAt = 0;
// Làm mượt: snapshot tới theo nhịp mạng (không đều) -> nội suy vị trí theo vận tốc tới tối đa 1 tick sim + độ trễ.
function livePos(pl, axes) {
  if (!pl || !pl.vel || snap.paused || snap.finished || !["gather", "quan"].includes(stage())) return pl ? pl.pos : [0, 0];
  const dt = Math.min(.05, (performance.now() - snapAt) / 1000);
  const b = (snap.meta && snap.meta.bounds) || {};
  return pl.pos.map((v, i) => { const r = b[axes[i]]; const x = v + pl.vel[i] * dt; return r ? Math.max(r[0], Math.min(r[1], x)) : x; });
}
async function poll() {
  const t0 = performance.now();
  try {
    const r = await fetch("/state", { cache: "no-store" });
    const s = await r.json();
    snap = s; offline = false; snapAt = performance.now();
    const key = stage() + ":" + s.phase + ":" + (s.day || 0);
    if (key !== stageKey) { stageKey = key; fx.length = 0; parts.length = 0; camX = null; }
    handleEvents(s.events || []);
  } catch (e) { offline = true; }
  if (!quitted) setTimeout(poll, Math.max(0, 16 - (performance.now() - t0)));
}
poll();

// ============================================================ ÂM THANH (WebAudio tự tạo)
let AC = null;
function audioInit() { if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } }
function beep(freq, dur = 0.12, type = "sine", vol = 0.12, slide = 0) {
  if (!AC || muted) return;
  const t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, freq + slide), t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + dur + 0.02);
}
// Phụ đề cho các hiệu ứng âm thanh đã triển khai (hiện cả khi TẮT tiếng — phím M).
const SUB = {
  gather: "SFX: Hái rau", catch: "SFX: Bắt cá", full: "SFX: Giỏ đầy", hurt: "SFX: Út Sen bị thương",
  bite: "SFX: Cá Sấu đớp", dive: "SFX: Lặn xuống", surface: "SFX: Ngoi lên thở", coin: "SFX: Nhận tiền",
  cook: "SFX: Bắt đầu nấu", ding: "SFX: Món chín!", pick: "SFX: Chọn", bad: "SFX: Cảnh báo",
  arrive: "SFX: Khách tới", spoil: "SFX: Đồ bị ươn",
};
const SFX = {
  gather: () => { say(SUB.gather); beep(660, 0.08, "triangle"); setTimeout(() => beep(880, 0.1, "triangle"), 70); },
  catch: () => { say(SUB.catch); beep(300, 0.15, "square", 0.06, 500); setTimeout(() => beep(990, 0.12, "triangle"), 120); },
  full: () => { say(SUB.full); beep(180, 0.25, "sawtooth", 0.06); },
  hurt: () => { say(SUB.hurt); beep(140, 0.35, "sawtooth", 0.1, -60); },
  bite: () => { say(SUB.bite); beep(90, 0.3, "sawtooth", 0.14, -30); setTimeout(() => beep(70, 0.3, "square", 0.08), 90); },
  dive: () => { say(SUB.dive); beep(420, 0.2, "sine", 0.06, -250); },
  surface: () => { say(SUB.surface); beep(260, 0.2, "sine", 0.06, 400); },
  coin: () => { say(SUB.coin); beep(988, 0.08, "square", 0.05); setTimeout(() => beep(1319, 0.18, "square", 0.05), 80); },
  cook: () => { say(SUB.cook); beep(220, 0.3, "triangle", 0.05, 80); },
  ding: () => { say(SUB.ding); beep(1568, 0.25, "sine", 0.08); },
  pick: () => { say(SUB.pick); beep(520, 0.08, "triangle", 0.07); },
  bad: () => { say(SUB.bad); beep(330, 0.18, "sawtooth", 0.05); setTimeout(() => beep(247, 0.3, "sawtooth", 0.05), 150); },
  arrive: () => { say(SUB.arrive); beep(784, 0.1, "sine", 0.06); setTimeout(() => beep(1046, 0.12, "sine", 0.06), 90); },
  spoil: () => { say(SUB.spoil); beep(200, 0.2, "triangle", 0.05, -80); },
};

// ============================================================ FX (chỉ client)
const fx = [], parts = [];
let shake = 0, flash = null;
function toast(x, y, txt, color = "#fff") { fx.push({ x, y, text: txt, color, t0: performance.now() }); }
function handleEvents(evs) {
  if (seenTick === -1) { seenTick = evs.length ? evs[evs.length - 1].tick : 0; return; }
  for (const e of evs) {
    if (e.tick <= seenTick) continue;
    const d = e.data || {}, p = snap.player ? snap.player.pos : [0, 0];
    const kn = (k) => (KIND[k] ? KIND[k].name : k);
    switch (e.name) {
      case "gather": toast(p[0], p[1] - 1.5, "+" + d.amount + " " + kn(d.kind), "#ffe58a"); SFX.gather(); break;
      case "fish_caught": toast(p[0], p[1] - 1.5, "+" + d.yield + " " + kn(d.kind), "#aef1ff"); SFX.catch(); if (Math.random() < .5) quip(pick(LINES.sen_catch));
        for (let i = 0; i < 18; i++) parts.push(bubble(p[0], p[1], true)); break;
      case "hold_full": toast(p[0], p[1] - 1.5, "Giỏ đầy! (cần " + d.required + ", còn " + d.free + ")", "#ffb4a2"); SFX.full(); break;
      case "dive": SFX.dive(); for (let i = 0; i < 14; i++) parts.push(bubble(p[0], 0.6, true)); break;
      case "surface": SFX.surface(); toast(p[0], -1.2, "Phù!", "#e0f7ff"); break;
      case "oxygen_empty": toast(p[0], p[1] - 1.5, "Hết hơi!", "#ff6b6b"); SFX.bad(); break;
      case "choke": toast(p[0], p[1] - 1.5, "Ngạt! −1 Máu", "#ff6b6b"); SFX.hurt(); shake = 12; flash = { t0: performance.now(), c: "255,40,40" }; break;

  text((storyLine + 1) + "/" + sc.length + " · Enter/Space: tiếp", x + W - 20, y + H - 16, { size: 16, align: "right", color: "#b9ff9e", weight: "800" });
}

// ============================================================ NHIỆM VỤ PHỤ
let questDone = new Set();
function questPanel(x, y, W) {
  const c = camp(); if (!c || !c.today || !c.today.quests) return;
  const qs = c.today.quests;
  qs.forEach((q) => { const key = c.today.day + q.id; if (q.done && !questDone.has(key)) { questDone.add(key); toast(snap.player.pos[0], snap.player.pos[1] - 3, "Xong nhiệm vụ: +" + q.reward + "k", "#ffd700"); SFX.coin(); } });
  panel(x, y, W, 40 + qs.length * 30, { r: 10, fill: "rgba(10,34,58,.78)" });
  text("Nhiệm vụ phụ", x + 14, y + 26, { size: 16, color: "#ffe4b5", weight: "800" });
  qs.forEach((q, i) => {
    const yy = y + 52 + i * 30, col = q.done ? "#9be15d" : q.failed ? "#a08a6a" : "#fff6e6";
    let label = (q.done ? "✓ " : q.failed ? "✗ " : "• ") + q.text + (q.n && !q.done && !q.failed && q.type !== "deep" ? " " + q.progress + "/" + q.n : "");
    while (label.length > 4 && textW(label, 16, "600") > W - 76) label = label.slice(0, -2) + "…";
    text(label, x + 14, yy, { size: 16, color: col });
    text("+" + q.reward + "k", x + W - 12, yy, { size: 16, align: "right", color: q.done ? "#9be15d" : "#ffd36b", weight: "800" });
  });
}

// ============================================================ CẢNH BÁO
function warnIcon(x, y, r, col) {
  ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(x, y - r); ctx.lineTo(x + r * 1.1, y + r * .8); ctx.lineTo(x - r * 1.1, y + r * .8); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = "#000"; ctx.lineWidth = 2; ctx.stroke();
  text("!", x, y + r * .6, { size: r * 1.3, align: "center", color: "#fff", weight: "900" });
}
function angryWarning(aw, h) {
  const meta = snap.meta || {}, pm = (meta.patience_s || 60) * 60;
  const angry = (snap.customers || []).filter((c) => c.state === "waiting" && c.patience_ticks_left / pm < .25);
  if (!angry.length) return;
  const a = .7 + .3 * Math.sin(now() * 8), msg = "Khách sắp giận! (" + angry.map((c) => c.table_id).join(", ") + ")";
  const tw = textW(msg, 22, "900") + 70, x = aw / 2 - tw / 2, y = 146;
  ctx.globalAlpha = a; panel(x, y, tw, 44, { fill: hiC ? "#000" : "rgba(120,10,10,.9)", stroke: hiC ? "#ff1744" : "#ffcdd2", r: 10, lw: 3, keep: true }); ctx.globalAlpha = 1;
  warnIcon(x + 28, y + 23, 13, "#ff1744");
  text(msg, x + 50, y + 30, { size: 22, color: hiC ? "#ffeb3b" : "#fff", weight: "900" });
}
function keyHintFixed(x, y, key, label) {
  const lw = textW(label, 18, "700"), kw = 32, W = kw + lw + 28;
  panel(x - W / 2, y - 20, W, 38, { r: 8, fill: "rgba(8,24,44,.92)", stroke: "rgba(255,214,120,.8)" });
  rr(x - W / 2 + 6, y - 14, kw, 26, 5); ctx.fillStyle = "#ffd36b"; ctx.fill();
  text(key, x - W / 2 + 6 + kw / 2, y + 5, { size: 16, align: "center", color: "#3a2208", weight: "800" });
  text(label, x - W / 2 + kw + 16, y + 6, { size: 18, color: "#fff6e6", weight: "700" });
}

// ============================================================ MINIGAME SƠ CHẾ (băm / chặt / đảo)
let MG = null;
const MG_TYPE = { ca_loc_nuong_trui: "chop", ca_keo_nuong: "chop", ca_keo_kho: "chop", chao_ca_loc: "chop",
  goi_bong_sung: "mince", canh_chua_ca_loc: "mince", bong_sung_xao: "mince", dien_dien_xao_trung: "mince", keo_neo_luoc: "mince",
  lau_ca_linh_dien_dien: "stir", lau_mam: "stir", ca_linh_chien: "stir" };
const MG_INFO = { chop: { target: 4, verb: "Chặt cá", help: "Kéo chuột xuống hoặc bấm S / ↓ để chặt" },
  mince: { target: 14, verb: "Băm rau", help: "Bấm liên tục Space hoặc chuột để băm" },
  stir: { target: 10, verb: "Đảo nồi", help: "Bấm xen kẽ A/D hoặc ←/→ để đảo" } };
const MG_DEMO = new URLSearchParams(location.search).get("mg");  // chỉ để chụp/kiểm giao diện minigame
function startMinigame(stoveId, dishId) {
  const type = MG_TYPE[dishId] || "mince";
  MG = { stove: stoveId, dish: dishId, type, t0: performance.now(), dur: 4, prog: 0, last: null, hitT: 0 };
  down.clear(); pushInput();
}
function mgHit() { if (!MG) return; MG.prog++; MG.hitT = performance.now(); beep(MG.type === "chop" ? 160 : 320 + Math.random() * 80, .06, "square", .05); if (MG.prog >= MG_INFO[MG.type].target) mgFinish(); }
function mgKey(k) {
  if (k === "escape") { MG = null; return; }
  if (MG.type === "chop" && (k === "s" || k === "arrowdown")) mgHit();
  else if (MG.type === "mince" && (k === " " || k === "e")) mgHit();
  else if (MG.type === "stir") {
    const side = k === "a" || k === "arrowleft" ? "L" : k === "d" || k === "arrowright" ? "R" : null;
    if (side && side !== MG.last) { MG.last = side; mgHit(); }
  }
}
function mgFinish() {
  if (!MG) return;
  const q = Math.min(1, MG.prog / MG_INFO[MG.type].target);
  if (q > 0) pushInput({ prep: { stove_id: MG.stove, quality: q } });
  MG = null;
}
function drawMinigame(aw, h) {
  if (!MG) return;
  const info = MG_INFO[MG.type], el = (performance.now() - MG.t0) / 1000;
  if (el >= MG.dur) { mgFinish(); return; }
  const W = 520, H = 210, x = aw / 2 - W / 2, y = h - H - 70, t = now();
  panel(x, y, W, H, { fill: "rgba(40,24,12,.96)", stroke: "#ffcf6b", r: 14, lw: 3 });
  text(info.verb + " — " + (DISH_NAME[MG.dish] || MG.dish), x + 20, y + 34, { size: 20, color: "#ffdf9a", weight: "900" });
  text(info.help, x + 20, y + 62, { size: 16, color: "#fff6e6" });
  // thớt + nguyên liệu
  ctx.fillStyle = lg(y + 80, y + 170, [[0, "#d9a46a"], [1, "#a87240"]]); rr(x + 30, y + 86, 300, 86, 14); ctx.fill();
  ctx.strokeStyle = "rgba(90,50,20,.5)"; ctx.lineWidth = 1; for (let k = 0; k < 6; k++) { ctx.beginPath(); ctx.moveTo(x + 40, y + 96 + k * 13); ctx.lineTo(x + 320, y + 96 + k * 13); ctx.stroke(); }
  const rec = Object.keys(((menu()[MG.dish] || {}).recipe) || {});
  const pieces = Math.min(8, 1 + MG.prog);
  for (let i = 0; i < pieces; i++) drawIcon(rec[i % rec.length] || "bong_sung", x + 70 + i * 32 + (MG.type === "stir" ? Math.sin(t * 8 + i) * 6 : 0), y + 128 + (i % 2) * 6, 16);
  // dao / vá theo nhịp
  const hit = Math.max(0, 1 - (performance.now() - MG.hitT) / 150);
  ctx.save(); ctx.translate(x + 200 + (MG.type === "stir" ? (MG.last === "L" ? -60 : 60) : 0), y + 112 - (1 - hit) * 26);
  if (MG.type === "stir") { ctx.strokeStyle = "#7a4a24"; ctx.lineWidth = 8; ctx.beginPath(); ctx.moveTo(0, -40); ctx.lineTo(0, 30); ctx.stroke(); ctx.fillStyle = "#7a4a24"; ellipse(0, 34, 14, 8); ctx.fill(); }
  else { ctx.fillStyle = "#d8dde2"; ctx.beginPath(); ctx.moveTo(-50, 0); ctx.lineTo(40, 0); ctx.lineTo(40, 26); ctx.quadraticCurveTo(-10, 30, -50, 0); ctx.fill(); ctx.strokeStyle = "#8a9096"; ctx.lineWidth = 2; ctx.stroke(); ctx.fillStyle = "#4a2a12"; rr(40, 2, 44, 16, 6); ctx.fill(); }
  ctx.restore();
  // tiến độ + thời gian
  const q = MG.prog / info.target;
  text("Tiến độ", x + 350, y + 110, { size: 16, color: "#ffe4b5", weight: "800" });
  bar(x + 350, y + 120, 150, 16, q, q >= 1 ? "#9be15d" : "#ffd36b");
  text("Thời gian", x + 350, y + 160, { size: 16, color: "#ffe4b5", weight: "800" });
  bar(x + 350, y + 170, 150, 10, 1 - el / MG.dur, "#4fd8ff");
  text("Esc: bỏ qua · làm tốt bếp nấu nhanh hơn tới 40%", x + W / 2, y + H - 12, { size: 14, align: "center", color: "rgba(255,246,230,.65)" });
}

// ============================================================ BENCH (?bench=<giây>&warm=<giây>&t0=<epoch ms>)
const BENCH = (() => {
  const q = new URLSearchParams(location.search);
  if (!q.has("bench")) return null;
  return { dur: Number(q.get("bench")) || 30, warm: Number(q.get("warm") || 3), first: 0, start: 0, last: 0, ms: [], sent: false };
})();
function benchTick(t) {
  const B = BENCH;
  if (B.sent) return;
  if (!B.first) { B.first = t; B.firstEpoch = Date.now(); B.last = t; return; }
  const dt = t - B.last; B.last = t;
  if (!B.start) { if (t - B.first >= B.warm * 1000) B.start = t; return; }
  B.ms.push(dt);
  if (t - B.start >= B.dur * 1000) {
    B.sent = true;
    fetch("/bench-result", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ frame_ms: B.ms, measured_s: (t - B.start) / 1000, first_frame_epoch_ms: B.firstEpoch, js_ms: PERF.ft, prof: PROF }) });
    document.title = "bench xong";
  }
}

// ============================================================ VÒNG VẼ
// Độ phân giải thích ứng: máy yếu (khung > 22 ms kéo dài) thì giảm độ phân giải canvas bên trong theo bậc,
// khung hiển thị vẫn đủ kích thước (làm mịn khi phóng) -> GPU đỡ tải. ?scale=<số> để khóa tỉ lệ khi đo.
const RSCALE = { v: Number(new URLSearchParams(location.search).get("scale") || 1), lock: new URLSearchParams(location.search).has("scale"), acc: 0, n: 0 };
function adaptScale(gapMs) {
  if (RSCALE.lock) return;
  RSCALE.acc += gapMs; RSCALE.n++;
  if (RSCALE.n < 90) return;
  const avg = RSCALE.acc / RSCALE.n; RSCALE.acc = 0; RSCALE.n = 0;
  if (avg > 22 && RSCALE.v > .6) RSCALE.v = Math.max(.6, RSCALE.v - .15);
  else if (avg < 12 && RSCALE.v < 1) RSCALE.v = Math.min(1, RSCALE.v + .1);
}
function fit() {
  const w = innerWidth, h = innerHeight;
  const dpr = Math.min(window.devicePixelRatio || 1, Math.sqrt(2.4e6 / Math.max(1, w * h)), 2) * RSCALE.v;
  DPR = dpr;
  if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = "high";
  return [w, h];
}
const PERF = { on: location.search.includes("bench"), ft: 0, gap: 0, last: 0, n: 0 };
addEventListener("keydown", (e) => { if (e.key === "F3") { PERF.on = !PERF.on; e.preventDefault(); } });
function frame() {
  requestAnimationFrame(frame);
  const t0 = performance.now();
  drawFrame();
  if (BENCH && snap) benchTick(t0);
  const dt = performance.now() - t0;
  PERF.ft = PERF.ft ? PERF.ft * .95 + dt * .05 : dt;
  if (PERF.last) PERF.gap = PERF.gap ? PERF.gap * .95 + (t0 - PERF.last) * .05 : t0 - PERF.last;
  if (PERF.last && t0 - PERF.last < 500) adaptScale(t0 - PERF.last);
  PERF.last = t0; PERF.n++;
  if (PERF.on) {
    const msg = "vẽ " + PERF.ft.toFixed(1) + " ms · " + (1000 / Math.max(1, PERF.gap)).toFixed(0) + " FPS";
    text(msg, 10, innerHeight - 34, { size: 16, color: "#9f9", stroke: "#000", strokeW: 3 });
    if (PERF.n % 10 === 0) document.title = msg + " · khung " + PERF.n;
  }
}
function drawFrame() {
  const [w, h] = fit();
  ctx.fillStyle = "#06203a"; ctx.fillRect(0, 0, w, h);
  if (quitted) { text("Đã thoát game. Có thể đóng tab này.", w / 2, h / 2, { align: "center", size: 24, weight: "800" }); return; }
  if (!snap) { text(offline ? "Không kết nối được máy chủ…" : "Đang tải…", w / 2, h / 2, { align: "center", size: 20 }); return; }
  const st = stage(), ph = phase();
  try {
    if (st === "ending") { drawEnding(w, h); overlay(w, h); return; }
    if (st === "shop" || (st === "dayresult" && ph === "shop")) {
      if (st === "shop") drawShop(w, h); else { drawShop(w, h); drawDayResult(w, h); }
      if (snap.paused) drawPause(w, h);
      floaters(); overlay(w, h); return;
    }
    if (MG_DEMO && ph === "quan" && !MG) { startMinigame("B1", MG_DEMO); MG.prog = 2; MG.dur = 1e9; }
    const info = LITE >= 2 ? { p: snap.player, meta: snap.meta || {}, D: 30, at: true, s: 20 } : ph === "quan" ? drawQuanWorld(w, h) : drawGatherWorld(w, h);
    if (st === "title") { drawTitle(w, h); overlay(w, h); return; }
    floaters();
    const _h = performance.now();
    if (ph === "quan") quanHUD(w, h, info); else gatherHUD(w, h, info);
    prof("hud", _h);
    if (st === "story") drawStory(w, h);
    else if (st === "dayintro") drawDayIntro(w, h);
    else if (st === "eveningintro") drawEveningIntro(w, h);
    if (snap.paused) drawPause(w, h);
    overlay(w, h);
  } catch (e) { console.error(e); }
}
requestAnimationFrame(frame);
</script>
