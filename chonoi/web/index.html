<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quán Ăn Chợ Nổi</title>
<style>
  html, body { margin: 0; height: 100%; background: #06203a; color: #fff6e6; font: 18px/1.4 "Segoe UI", system-ui, sans-serif; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
"use strict";
/*
 * Quán Ăn Chợ Nổi — client trình duyệt. CHỈ ĐỌC snapshot (GET /state) và gửi phím (POST /input, /next, /new, /buy, /menu, /quit).
 * Vẽ thẳng ở độ phân giải gốc của màn hình (nhân devicePixelRatio) để nét mịn và chi tiết.
 * Hiệu ứng (sóng, bọt, tia sáng, khói, chữ bay, âm thanh) dùng Math.random của trình duyệt, KHÔNG vào mô phỏng.
 * Phím: WASD/mũi tên · Shift sprint · E tương tác · Space bắt cá · Esc/P tạm dừng · Enter tiếp · 1–7 mua · R chơi lại Ngày · M tiếng.
 */
const cv = document.getElementById("c");
const ctx = cv.getContext("2d");
let snap = null, offline = false, quitted = false;
const W2S = { sx: (x) => x, sy: (y) => y, s: 1 };

// ============================================================ TIỆN ÍCH
const FONT = '"Segoe UI", system-ui, sans-serif';
const now = () => performance.now() / 1000;
const clamp01 = (v) => Math.max(0, Math.min(1, v));
const lerp = (a, b, t) => a + (b - a) * t;
function hash(n) { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }
function text(s, x, y, o = {}) {
  ctx.font = (o.weight || "600") + " " + (o.size || 18) + "px " + FONT;
  ctx.textAlign = o.align || "left"; ctx.textBaseline = o.base || "alphabetic";
  if (o.stroke) { ctx.lineWidth = o.strokeW || 4; ctx.strokeStyle = o.stroke; ctx.lineJoin = "round"; ctx.strokeText(s, x, y); }
  ctx.fillStyle = o.color || "#fff6e6"; ctx.fillText(s, x, y);
}
function textW(s, size = 18, weight = "600") { ctx.font = weight + " " + size + "px " + FONT; return ctx.measureText(s).width; }
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x, y, w, h, r) : ctx.rect(x, y, w, h); }
function panel(x, y, w, h, o = {}) {
  ctx.save();
  if (o.shadow !== false) { ctx.shadowColor = "rgba(0,0,0,.35)"; ctx.shadowBlur = 12; ctx.shadowOffsetY = 4; }
  rr(x, y, w, h, o.r ?? 12);
  ctx.fillStyle = o.fill || "rgba(10,34,58,.82)"; ctx.fill(); ctx.restore();
  rr(x, y, w, h, o.r ?? 12);
  ctx.lineWidth = o.lw || 2; ctx.strokeStyle = o.stroke || "rgba(160,230,255,.45)"; ctx.stroke();
}
function bar(x, y, w, h, frac, col, bg = "rgba(0,0,0,.35)") {
  rr(x, y, w, h, h / 2); ctx.fillStyle = bg; ctx.fill();
  if (frac > 0) { rr(x, y, Math.max(h, w * clamp01(frac)), h, h / 2); ctx.fillStyle = col; ctx.fill(); }
  ctx.fillStyle = "rgba(255,255,255,.22)"; rr(x + 2, y + 1, Math.max(0, w * clamp01(frac) - 4), h * .35, h * .2); ctx.fill();
}
function fmtTime(ticks) { const s = Math.ceil((ticks || 0) / 60); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); }
function lg(y0, y1, stops) { const g = ctx.createLinearGradient(0, y0, 0, y1); stops.forEach(([o, c]) => g.addColorStop(o, c)); return g; }
function ellipse(x, y, rx, ry, rot = 0) { ctx.beginPath(); ctx.ellipse(x, y, Math.max(.1, rx), Math.max(.1, ry), rot, 0, Math.PI * 2); }
function circle(x, y, r) { ctx.beginPath(); ctx.arc(x, y, Math.max(.1, r), 0, Math.PI * 2); }
function freshCol(f) { return f >= 70 ? "#5ee07a" : f >= 45 ? "#d7e35a" : f >= 30 ? "#ffb347" : "#9a8a78"; }

// ============================================================ DỮ LIỆU
const KIND = {
  ca_loc: { name: "Cá lóc" }, ca_linh: { name: "Cá linh" }, ca_keo: { name: "Cá kèo" },
  bong_dien_dien: { name: "Bông điên điển" }, bong_sung: { name: "Bông súng" }, keo_neo: { name: "Kèo nèo" },
};
const DISH_NAME = {
  ca_loc_nuong_trui: "Cá lóc nướng trui", goi_bong_sung: "Gỏi bông súng", lau_ca_linh_dien_dien: "Lẩu cá linh bông điên điển",
  canh_chua_ca_loc: "Canh chua cá lóc", ca_keo_nuong: "Cá kèo nướng muối ớt", lau_mam: "Lẩu mắm miền Tây",
};
const DISH_SHORT = {
  ca_loc_nuong_trui: "Cá lóc nướng", goi_bong_sung: "Gỏi bông súng", lau_ca_linh_dien_dien: "Lẩu cá linh",
  canh_chua_ca_loc: "Canh chua", ca_keo_nuong: "Cá kèo nướng", lau_mam: "Lẩu mắm",
};
const menu = () => (snap && snap.menu) || {};
const STORY = [
  { title: "Ngày đầu mùa nước nổi", dawn: "Út ơi, má đau lưng quá. Con ra sông kiếm cá lóc với bông súng nấu cho khách nghen!", night: "Khách tới rồi Út! Nấu lẹ lẹ cho người ta ăn." },
  { title: "Cá linh về", dawn: "Nước lên, cá linh theo dòng về đông lắm. Hái thêm bông điên điển nấu lẩu nghen con.", night: "Lẩu cá linh bông điên điển là món tủ của quán mình đó." },
  { title: "Dưới đáy có cá kèo", dawn: "Mấy ổng nói cá kèo nằm sát đáy, mà coi chừng Cá Sấu Năm Chèo nghen con!", night: "Cá kèo nướng muối ớt thơm lừng, khách ghé đông." },
  { title: "Khách phương xa", dawn: "Có đoàn khách đòi ăn lẩu mắm. Kèo nèo mọc ở cuối khúc sông đó Út.", night: "Khách phương xa khó tánh, con nhớ bưng cho kịp." },
  { title: "Ngày cuối mùa", dawn: "Bữa cuối mùa nước nổi rồi. Ráng lên con, má tin con!", night: "Bữa cuối mùa, mình làm một bữa thiệt hoành tráng nghen!" },
];
const camp = () => (snap && snap.campaign) || null;
const stage = () => (camp() ? camp().stage : snap ? snap.phase : "gather");
const phase = () => (snap ? snap.phase : "gather");
const story = () => STORY[Math.max(0, Math.min(STORY.length - 1, ((snap && snap.day) || 1) - 1))];
const playing = () => snap && !snap.finished && !snap.paused && ["gather", "quan", "shop"].includes(stage());

// ============================================================ INPUT
const down = new Set();
const MOVE_KEYS = { w: "u", arrowup: "u", s: "d", arrowdown: "d", a: "l", arrowleft: "l", d: "r", arrowright: "r" };
let queue = [], inflight = false, lastSent = "", menuSel = 0, pauseSel = 0;
function currentInput() {
  const dx = (down.has("r") ? 1 : 0) - (down.has("l") ? 1 : 0);
  let dy = (down.has("d") ? 1 : 0) - (down.has("u") ? 1 : 0);
  if (phase() === "quan") dy = -dy;
  return { move: [dx, dy], interact: down.has("interact"), catch: down.has("catch"), sprint: down.has("sprint") };
}
function pushInput(extra) {
  const body = Object.assign(currentInput(), extra || {});
  const s = JSON.stringify(body);
  if (!extra && s === lastSent) return;
  lastSent = JSON.stringify(currentInput()); queue.push(s); flush();
}
async function flush() {
  if (inflight) return;
  inflight = true;
  while (queue.length) {
    const body = queue.shift();
    try { await fetch("/input", { method: "POST", body, headers: { "Content-Type": "application/json" } }); } catch (e) {}
  }
  inflight = false;
}
function post(path, body) { return fetch(path, { method: "POST", body: body ? JSON.stringify(body) : "", headers: { "Content-Type": "application/json" } }).then((r) => r.json()).catch(() => null); }
function advance() { post("/next"); fx.length = 0; }
function togglePause() { pushInput({ pause: true }); }
let muted = false;
function titleOptions() {
  const c = camp(); const o = [];
  if (c && c.can_continue) o.push(["cont", "Chơi tiếp (Ngày " + c.saved_day + ")"], ["new", "Chơi mới"]);
  else o.push(["play", "Chơi"]);
  o.push(["quit", "Thoát"]);
  return o;
}
function chooseTitle() {
  const [id] = titleOptions()[Math.min(menuSel, titleOptions().length - 1)];
  SFX.pick();
  if (id === "quit") { post("/quit"); quitted = true; }
  else if (id === "new") post("/new");
  else advance();
}
addEventListener("keydown", (e) => {
  const k = e.key.toLowerCase();
  audioInit();
  if ([" ", "arrowup", "arrowdown", "arrowleft", "arrowright", "tab"].includes(k)) e.preventDefault();
  if (k === "shift") { down.add("sprint"); pushInput(); return; }
  if (e.repeat) return;
  if (k === "m") { muted = !muted; return; }
  const st = stage(), c = camp();
  if (!snap || quitted) return;
  if (snap.paused && ["gather", "quan", "shop"].includes(st)) {
    if (k === "arrowup" || k === "w" || k === "arrowdown" || k === "s") pauseSel = 1 - pauseSel;
    else if (k === "escape" || k === "p") togglePause();
    else if (k === "enter" || k === "e" || k === " ") { SFX.pick(); if (pauseSel === 0) togglePause(); else post("/menu"); pauseSel = 0; }
    return;
  }
  if (st === "title") {
    const n = titleOptions().length;
    if (k === "arrowup" || k === "w") menuSel = (menuSel + n - 1) % n;
    else if (k === "arrowdown" || k === "s") menuSel = (menuSel + 1) % n;
    else if (k === "enter" || k === "e" || k === " ") chooseTitle();
    else if (k === "n" && c && c.can_continue) { SFX.pick(); post("/new"); }
    return;
  }
  if (["dayintro", "eveningintro", "dayresult", "ending"].includes(st)) {
    if (k === "r" && st !== "ending" && st !== "dayresult") post("/restart");
    else { SFX.pick(); advance(); }
    return;
  }
  if (k === "escape" || k === "p") { SFX.pick(); pauseSel = 0; togglePause(); return; }
  if (st === "shop") {
    if (/^[1-9]$/.test(k)) {
      const item = c.shop[Number(k) - 1];
      if (item) post("/buy", { id: item.id }).then((r) => { if (!r || !r.ok) SFX.bad(); else if (!item.core) SFX.coin(); });
    } else if (k === "enter" || k === "e") { SFX.pick(); advance(); }
    return;
  }
  if (MOVE_KEYS[k]) down.add(MOVE_KEYS[k]);
  else if (k === "e") down.add("interact");
  else if (k === " ") down.add("catch");
  else if (k === "r") { post("/restart"); lastSent = ""; down.clear(); fx.length = 0; }
  pushInput();
});
addEventListener("keyup", (e) => {
  const k = e.key.toLowerCase();
  if (MOVE_KEYS[k]) down.delete(MOVE_KEYS[k]);
  else if (k === "e") down.delete("interact");
  else if (k === " ") down.delete("catch");
  else if (k === "shift") down.delete("sprint");
  pushInput();
});
addEventListener("blur", () => { down.clear(); pushInput(); });

// ============================================================ POLL
let stageKey = "", seenTick = -1;
async function poll() {
  try {
    const r = await fetch("/state", { cache: "no-store" });
    const s = await r.json();
    snap = s; offline = false;
    const key = stage() + ":" + s.phase + ":" + (s.day || 0);
    if (key !== stageKey) { stageKey = key; fx.length = 0; parts.length = 0; camX = null; }
    handleEvents(s.events || []);
  } catch (e) { offline = true; }
  if (!quitted) setTimeout(poll, 16);
}
poll();

// ============================================================ ÂM THANH (WebAudio tự tạo)
let AC = null;
function audioInit() { if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } }
function beep(freq, dur = 0.12, type = "sine", vol = 0.12, slide = 0) {
  if (!AC || muted) return;
  const t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, freq + slide), t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + dur + 0.02);
}
const SFX = {
  gather: () => { beep(660, 0.08, "triangle"); setTimeout(() => beep(880, 0.1, "triangle"), 70); },
  catch: () => { beep(300, 0.15, "square", 0.06, 500); setTimeout(() => beep(990, 0.12, "triangle"), 120); },
  full: () => beep(180, 0.25, "sawtooth", 0.06),
  hurt: () => beep(140, 0.35, "sawtooth", 0.1, -60),
  bite: () => { beep(90, 0.3, "sawtooth", 0.14, -30); setTimeout(() => beep(70, 0.3, "square", 0.08), 90); },
  dive: () => beep(420, 0.2, "sine", 0.06, -250),
  surface: () => beep(260, 0.2, "sine", 0.06, 400),
  coin: () => { beep(988, 0.08, "square", 0.05); setTimeout(() => beep(1319, 0.18, "square", 0.05), 80); },
  cook: () => beep(220, 0.3, "triangle", 0.05, 80),
  ding: () => beep(1568, 0.25, "sine", 0.08),
  pick: () => beep(520, 0.08, "triangle", 0.07),
  bad: () => { beep(330, 0.18, "sawtooth", 0.05); setTimeout(() => beep(247, 0.3, "sawtooth", 0.05), 150); },
  arrive: () => { beep(784, 0.1, "sine", 0.06); setTimeout(() => beep(1046, 0.12, "sine", 0.06), 90); },
  spoil: () => beep(200, 0.2, "triangle", 0.05, -80),
};

// ============================================================ FX (chỉ client)
const fx = [], parts = [];
let shake = 0, flash = null;
function toast(x, y, txt, color = "#fff") { fx.push({ x, y, text: txt, color, t0: performance.now() }); }
function handleEvents(evs) {
  if (seenTick === -1) { seenTick = evs.length ? evs[evs.length - 1].tick : 0; return; }
  for (const e of evs) {
    if (e.tick <= seenTick) continue;
    const d = e.data || {}, p = snap.player ? snap.player.pos : [0, 0];
    const kn = (k) => (KIND[k] ? KIND[k].name : k);
    switch (e.name) {
      case "gather": toast(p[0], p[1] - 1.5, "+" + d.amount + " " + kn(d.kind), "#ffe58a"); SFX.gather(); break;
      case "fish_caught": toast(p[0], p[1] - 1.5, "+" + d.yield + " " + kn(d.kind), "#aef1ff"); SFX.catch();
        for (let i = 0; i < 18; i++) parts.push(bubble(p[0], p[1], true)); break;
      case "hold_full": toast(p[0], p[1] - 1.5, "Giỏ đầy! (cần " + d.required + ", còn " + d.free + ")", "#ffb4a2"); SFX.full(); break;
      case "dive": SFX.dive(); for (let i = 0; i < 14; i++) parts.push(bubble(p[0], 0.6, true)); break;
      case "surface": SFX.surface(); toast(p[0], -1.2, "Phù!", "#e0f7ff"); break;
      case "oxygen_empty": toast(p[0], p[1] - 1.5, "Hết hơi!", "#ff6b6b"); SFX.bad(); break;
      case "choke": toast(p[0], p[1] - 1.5, "Ngạt! −1 Máu", "#ff6b6b"); SFX.hurt(); shake = 12; flash = { t0: performance.now(), c: "255,40,40" }; break;
      case "monster_hit": toast(p[0], p[1] - 1.8, "Cá Sấu đớp! −1 Máu" + (d.lost && d.lost.length ? " · rơi " + d.lost.length + " món" : ""), "#d9a8ff");
        SFX.bite(); shake = 16; flash = { t0: performance.now(), c: "150,40,200" }; break;
      case "faint": SFX.hurt(); flash = { t0: performance.now(), c: "0,0,0" }; break;
      case "spoiled": SFX.spoil(); if (phase() === "gather") toast(p[0], p[1] - 2.2, kn(d.kind) + " bị ươn!", "#c9b79c"); else toast(11, 9.5, kn(d.kind) + " trong kho bị ươn!", "#c9b79c"); break;
      case "customer_arrived": SFX.arrive(); toast(...tablePos(d.table_id), "Khách gọi " + (DISH_SHORT[d.dish_id] || d.dish_id), "#fff1c1"); break;
      case "no_dish": toast(11, 8, "Khách tới mà hết món…", "#ffb4a2"); SFX.bad(); break;
      case "cook_started": SFX.cook(); toast(...stovePos(d.stove_id), "Nấu · giá " + d.base_price + "k", "#ffd49a"); break;
      case "dish_ready": SFX.ding(); toast(...stovePos(d.stove_id), "Chín rồi!", "#b9ff9e"); break;
      case "dish_picked": SFX.pick(); break;
      case "served": SFX.pick(); toast(...tablePos(d.table_id), d.tip > 0 ? "Ngon quá! (boa " + d.tip + "k)" : "Mời dùng", "#b9ff9e"); break;
      case "paid": SFX.coin(); { const tp = tablePos(d.table_id); toast(tp[0], tp[1] + .6, "+" + d.amount + "k", "#ffd700"); for (let i = 0; i < 14; i++) parts.push(coin(tp[0], tp[1])); } break;
      case "customer_left": if (d.reason === "patience") { SFX.bad(); toast(...tablePos(d.table_id), "Khách bỏ về! uy tín ↓", "#ff8a80"); shake = 6; } break;
      case "bought": SFX.coin(); break;
      case "buy_failed": SFX.bad(); break;
    }
  }
  if (evs.length) seenTick = Math.max(seenTick, evs[evs.length - 1].tick);
}
function stovePos(id) { const s = (snap.stoves || []).find((x) => x.id === id); return s ? [s.pos[0], s.pos[1] + 1.6] : [2, 8]; }
function tablePos(id) { const t = (snap.tables || []).find((x) => x.id === id); return t ? [t.pos[0], t.pos[1] + 2.4] : [9, 2]; }
function bubble(x, y, burst) {
  return { k: "b", x: x + (Math.random() - .5) * (burst ? 1.4 : .3), y, vx: (Math.random() - .5) * .02, vy: -(.02 + Math.random() * .05),
    r: .05 + Math.random() * .16, t0: performance.now() };
}
function coin(x, y) { return { k: "c", x, y: y + .5, vx: (Math.random() - .5) * .08, vy: .06 + Math.random() * .06, t0: performance.now() }; }
function smoke(x, y) { return { k: "s", x: x + (Math.random() - .5) * .4, y, vx: (Math.random() - .5) * .01, vy: .02 + Math.random() * .012, r: .2, t0: performance.now() }; }
function particles(sx, sy, s) {
  const T = performance.now();
  for (let i = parts.length - 1; i >= 0; i--) {
    const q = parts[i], age = (T - q.t0) / 1000;
    if (q.k === "b") {
      q.x += q.vx + Math.sin(age * 6 + i) * .004; q.y += q.vy; q.vy -= .0006;
      if (q.y < 0 || age > 3.5) { parts.splice(i, 1); continue; }
      ctx.strokeStyle = "rgba(235,252,255,.85)"; ctx.lineWidth = Math.max(1, s * .06); circle(sx(q.x), sy(q.y), q.r * s); ctx.stroke();
      ctx.fillStyle = "rgba(255,255,255,.7)"; circle(sx(q.x) - q.r * s * .35, sy(q.y) - q.r * s * .35, q.r * s * .25); ctx.fill();
    } else if (q.k === "c") {
      q.x += q.vx; q.y += q.vy; q.vy -= .004; if (age > 1.2) { parts.splice(i, 1); continue; }
      const w = s * .3 * Math.abs(Math.cos(age * 12)) + 2;
      ctx.fillStyle = "#ffd700"; ellipse(sx(q.x), sy(q.y), w / 2, s * .15); ctx.fill(); ctx.strokeStyle = "#a67c00"; ctx.lineWidth = 1; ctx.stroke();
    } else if (q.k === "s") {
      q.x += q.vx; q.y += q.vy; q.r += .006; if (age > 2.5) { parts.splice(i, 1); continue; }
      ctx.fillStyle = `rgba(235,235,235,${.32 * (1 - age / 2.5)})`; circle(sx(q.x), sy(q.y), q.r * s); ctx.fill();
    }
  }
}
function floaters() {
  const T = performance.now(), { sx, sy } = W2S;
  for (let i = fx.length - 1; i >= 0; i--) {
    const f = fx[i], age = (T - f.t0) / 1000;
    if (age > 1.8) { fx.splice(i, 1); continue; }
    const yy = phase() === "quan" ? f.y + age * .9 : f.y - age * .9;
    ctx.globalAlpha = Math.min(1, 2 * (1.8 - age));
    text(f.text, sx(f.x), sy(yy), { size: 20, align: "center", color: f.color, stroke: "rgba(5,15,30,.92)", strokeW: 5, weight: "800" });
    ctx.globalAlpha = 1;
  }
}

// ============================================================ ICON NGUYÊN LIỆU / MÓN (chi tiết)
function fishBody(len, h, cTop, cBelly, o = {}) {
  const g = ctx.createLinearGradient(0, -h, 0, h);
  g.addColorStop(0, cTop); g.addColorStop(.55, o.mid || cTop); g.addColorStop(1, cBelly);
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.moveTo(len, 0);
  ctx.bezierCurveTo(len * .8, -h * 1.05, -len * .4, -h * 1.1, -len * .85, -h * .2);
  ctx.lineTo(-len * .85, h * .2);
  ctx.bezierCurveTo(-len * .4, h * 1.05, len * .8, h * 1.0, len, 0);
  ctx.fill();
  ctx.strokeStyle = o.line || "rgba(0,0,0,.35)"; ctx.lineWidth = Math.max(.6, h * .08); ctx.stroke();
}
function fishTail(len, h, col, wig) {
  ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(-len * .8, 0);

// ============================================================ VÒNG VẼ
function fit() {
  const dpr = window.devicePixelRatio || 1, w = innerWidth, h = innerHeight;
  if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = "high";
  return [w, h];
}
function frame() {
  requestAnimationFrame(frame);
  const [w, h] = fit();
  ctx.fillStyle = "#06203a"; ctx.fillRect(0, 0, w, h);
  if (quitted) { text("Đã thoát game. Có thể đóng tab này.", w / 2, h / 2, { align: "center", size: 24, weight: "800" }); return; }
  if (!snap) { text(offline ? "Không kết nối được máy chủ…" : "Đang tải…", w / 2, h / 2, { align: "center", size: 20 }); return; }
  const st = stage(), ph = phase();
  try {
    if (st === "ending") { drawEnding(w, h); return; }
    if (st === "shop" || (st === "dayresult" && ph === "shop")) {
      if (st === "shop") drawShop(w, h); else { drawShop(w, h); drawDayResult(w, h); }
      if (snap.paused) drawPause(w, h);
      floaters(); overlay(w, h); return;
    }
    const info = ph === "quan" ? drawQuanWorld(w, h) : drawGatherWorld(w, h);
    if (st === "title") { drawTitle(w, h); return; }
    floaters();
    if (ph === "quan") quanHUD(w, h, info); else gatherHUD(w, h, info);
    if (st === "dayintro") drawDayIntro(w, h);
    else if (st === "eveningintro") drawEveningIntro(w, h);
    if (snap.paused) drawPause(w, h);
    overlay(w, h);
  } catch (e) { console.error(e); }
}
requestAnimationFrame(frame);
